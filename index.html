<div class="meta">
  <h1>对话体验升级与会话分支</h1>
  <p>本次更新新增**对话过程摘要**、**会话分支**和**推理偏好记忆**，并升级了**引导消息队列**。任务进行到哪、AI 正在做什么，现在会看得更加清楚。聊到一半，不满意，想换个方向，可以直接从任意回复节点创建分支，继续对话；任务执行过程中临时有新要求，也可以随时补充。常用的推理强度也不用反复设置，元玺会保持上次选择的推理强度延续对话。整个对话过程更透明，操作更省心，处理复杂任务时也更有掌控感。</p>
  <p><span class="tag">v1.7.0</span><span class="tag">更新范围 2026.07.22 - 2026.07.31</span><span class="tag">重大版本</span></p>
</div>
<div class="card" id="content"></div>
<script>
const md = "## 元玺 v1.7.0 更新日志\n\n![元玺 v1.7.0 封面图](images/1.7.0_cover.jpg)\n\n本次更新新增**对话过程摘要**、**会话分支**和**推理偏好记忆**，并升级了**引导消息队列**。任务进行到哪、AI 正在做什么，现在会看得更加清楚。聊到一半，不满意，想换个方向，可以直接从任意回复节点创建分支，继续对话；任务执行过程中临时有新要求，也可以随时补充。常用的推理强度也不用反复设置，元玺会保持上次选择的推理强度延续对话。整个对话过程更透明，操作更省心，处理复杂任务时也更有掌控感。\n\n### 版本核心亮点\n\n1. **对话过程摘要**：把思考、工具调用和处理结果集中到一起，可根据需求展开查看细节或是收起关注结果。\n2. **会话分支能力**：从任意一条 AI 回复创建分支，带着当前位置的上下文换个方向继续聊。\n3. **推理偏好记忆**：自动记住上次选择的推理强度，新建会话时保持不变。\n\n---\n\n## ✨ 新增与重大升级\n\n### 🧠 对话过程摘要：把关键过程集中起来\n\n![对话过程摘要配图](images/1.7.0_content_1.jpg)\n\n复杂任务里的思考、工具调用和处理结果，现在会集中显示。你可以展开查看细节，也可以收起，只关注当前进展：\n\n- **关键过程集中展示**：思考、工具调用和处理结果放在一起，不用在长对话中来回翻找。\n- **更早看到任务反馈**：优化流式响应首包和思考状态文案，提交后能更快知道任务已经开始处理。\n- **按需查看思考内容**：折叠与展开操作更清楚，不看细节时也能保持界面简洁。\n\n### 🌿 会话分支：从任意回复开启新探索\n\n![会话分支配图](images/1.7.0_content_2.jpg)\n\n聊到一半想换个方向，又不想丢掉前面的上下文。现在可以直接从任意一条 AI 回复创建新会话分支：\n\n- **从当前位置开始**：选中合适的回复创建分支，不必从头复述需求。\n- **自动继承上下文**：新分支会带上对应的对话内容，可以直接接着聊。\n- **原对话不受影响**：同一个问题可以尝试不同方案，各条分支互不干扰。\n\n### ⚡ 推理强度记忆：选过一次，下次自动跟上\n\n![推理强度记忆配图](images/1.7.0_content_3.jpg)\n\n以前每次新建会话，都要重新选择推理强度。现在系统会记住上一次的选择，新会话直接沿用：\n\n- **新会话自动带回**：上次选过的推理强度，无需重复设置。\n- **同一对话保持一致**：后续消息和延迟消息都会沿用当前会话的推理设置。\n- **滑块操作更直观**：支持悬停滑动选择，并用「更高效 / 更智能」说明档位差异。\n\n### 📬 引导消息队列：任务进行中也能继续补充\n\n![引导消息队列配图](images/1.7.0_content_4.jpg)\n\n任务还没结束时，如果临时想到补充要求，可以直接追加消息，不用等它跑完：\n\n- **运行中继续补充**：当前任务执行期间，也可以追加新的指令。\n- **管理待处理消息**：支持排队、撤回和重试，发错了可以及时调整。\n- **刷新后恢复现场**：未完成状态和输入草稿可以恢复，减少意外中断带来的重复操作。\n\n---\n\n## 🛠️ 体验优化\n\n- 调整长对话的滚动跟随、用户消息定位和任务状态展示，查找上下文更方便。\n- 改进队列错误提示、长文本展示和提交后的自动滚动。\n- 调整虚拟电脑全屏、移动端布局和加载状态。\n- 工具执行失败后仍可打开详情，方便查看具体问题。\n\n---\n\n## 🐛 问题修复\n\n- 修复 AskUser 表单中转义字符丢失的问题。\n- 修复文件上传失败后仍触发服务端删除请求的问题。\n- 改进输入草稿的 HTML 清理和附件恢复，减少草稿还原异常。\n\n---\n\n感谢每一位用户的信任与支持 ❤️\n\n**元玺，让 AI 成为你的超能力。**\n";
document.getElementById('content').innerHTML = marked.parse(md);
</script>
